name: Build preview

# Builds the GoPlus fork for every platform OpenPipes ships. Every push to
# master produces downloadable artifacts but publishes nothing; a rolling
# prerelease is only created when this workflow is dispatched with the
# `publish` input set. Upstream's own `Build` workflow is disabled on this
# fork; this replaces it with a smaller matrix plus packaging.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish the rolling GoPlus preview release'
        type: boolean
        default: false

permissions:
  contents: write

# Two pushes in quick succession would otherwise race over the same release tag.
concurrency:
  group: goplus-preview
  cancel-in-progress: false

jobs:
  calc_ver:
    runs-on: ubuntu-latest
    outputs:
      project_ver: ${{steps.vers.outputs.project_ver}}
      build_ver: ${{steps.vers.outputs.build_ver}}
      full_ver: ${{steps.vers.outputs.full_ver}}
      release_flag: ${{steps.vers.outputs.release_flag}}
    steps:
    - uses: actions/checkout@v4.1.1
    - name: Calculate versions
      id: vers
      shell: bash
      run: |
        git fetch --prune --unshallow --tags || true
        # Only version-like tags may drive this. The rolling preview release
        # puts a 'streaming-preview' tag on the repo, and a plain describe picks
        # it up and hands CMake VERSION "streaming", which it rejects outright.
        GIT_VERSION=`git describe --tags --match '[0-9]*' 2>/dev/null || true`
        if [ -n "$GIT_VERSION" ]; then
          PROJECT_VERSION=`echo $GIT_VERSION | cut -d- -f1`
          BUILD_VERSION=`echo $GIT_VERSION | cut -d- -f2-3 --output-delimiter=.`
        else
          # No release tag reachable: version.txt is what CMake would use anyway.
          PROJECT_VERSION=`tr -d '[:space:]' < version.txt`
          BUILD_VERSION="0.`git rev-list --count HEAD`"
        fi
        echo "resolved version: $PROJECT_VERSION-$BUILD_VERSION"
        echo "project_ver=$PROJECT_VERSION" >>$GITHUB_OUTPUT
        echo "build_ver=$BUILD_VERSION" >>$GITHUB_OUTPUT
        echo "full_ver=$PROJECT_VERSION-$BUILD_VERSION" >>$GITHUB_OUTPUT
        # ON selects -O3; with it unset the build is -Og, which is useless for
        # judging audio timing and produces a 200 MB executable.
        echo "release_flag=ON" >>$GITHUB_OUTPUT

  build:
    needs: [calc_ver]
    runs-on: ${{matrix.run_on}}
    strategy:
      fail-fast: false
      matrix:
        include:
        # Raspberry Pi OS 64-bit, which is what Pipebian64 is built on
        - {run_on: ubuntu-22.04,   for: linux-aarch64,   prepare: debian-based, build_on: linux, wx_version: wx32, name: raspi-arm64}
        - {run_on: ubuntu-22.04,   for: linux-armhf,     prepare: debian-based, build_on: linux, wx_version: wx32, name: raspi-armhf}
        - {run_on: ubuntu-22.04,   for: linux,           prepare: debian-based, build_on: linux, wx_version: wx32, name: linux-x86_64}
        - {run_on: ubuntu-22.04,   for: appimage-x86_64, prepare: debian-based, build_on: linux, wx_version: wx32, name: linux-appimage}
        - {run_on: macos-14,       for: osx,             prepare: osx,          build_on: osx,                     name: macos-arm64}
        - {run_on: macos-15-intel, for: osx,             prepare: osx,          build_on: osx,                     name: macos-intel}
        - {run_on: ubuntu-latest,  for: win64,           prepare: debian-based, build_on: linux,                   name: windows-x86_64}
    steps:
    - uses: actions/checkout@v4.1.1
      with:
        submodules: true

    - name: Install Dependencies
      run: ${{github.workspace}}/build-scripts/for-${{matrix.for}}/prepare-${{matrix.prepare}}.sh "${{matrix.wx_version}}"

    - name: Build
      run: >
        ${{github.workspace}}/build-scripts/for-${{matrix.for}}/build-on-${{matrix.build_on}}.sh
        ${{needs.calc_ver.outputs.project_ver}}
        ${{needs.calc_ver.outputs.build_ver}}
        ${{github.workspace}}
        ""
        ${{needs.calc_ver.outputs.release_flag}}
        ""
        ""

    - name: Stage artifacts
      # The packages are already named goplus- by the packaging rules; this
      # only gathers them for upload. A file still named grandorgue- would be
      # one built before the packaging rename, and it is renamed rather than
      # uploaded under a name it no longer has.
      working-directory: ${{github.workspace}}/build/${{matrix.for}}
      run: |
        mkdir -p dist
        shopt -s nullglob
        for f in goplus*${{needs.calc_ver.outputs.full_ver}}* grandorgue*${{needs.calc_ver.outputs.full_ver}}*; do
          test -f "$f" || continue
          case "$f" in
            goplus*) cp "$f" "dist/$f" ;;
            grandorgue*) cp "$f" "dist/goplus${f#grandorgue}" ;;
          esac
        done
        ls -lh dist
        test -n "$(ls -A dist)" || { echo "no artifacts produced"; exit 1; }

    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: goplus-${{matrix.name}}
        path: ${{github.workspace}}/build/${{matrix.for}}/dist/*
        if-no-files-found: error

  release:
    # One job publishes everything once, after every platform has finished.
    # Letting each build job touch the release would have them racing. Only a
    # manual dispatch with `publish` set touches the rolling release: an
    # ordinary push to master leaves artifacts in the run and nothing else.
    needs: [calc_ver, build]
    if: always() && needs.build.result != 'cancelled' && inputs.publish
    runs-on: ubuntu-latest
    steps:
    - name: Collect artifacts
      uses: actions/download-artifact@v4
      with:
        path: staging
        pattern: goplus-*
        merge-multiple: true

    - name: Publish rolling preview release
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        GH_REPO: ${{github.repository}}
      working-directory: staging
      run: |
        ls -lh
        TAG=goplus-preview
        cat > NOTES.md <<'EOF'
        GoPlus preview build: GrandOrgue with Hauptwerk sample set support and a
        demand-paged streaming engine, for Windows, Linux x86_64, Raspberry Pi
        (64-bit and armhf) and macOS.

        **This is not a GrandOrgue release** and the GrandOrgue project does not
        support it. Report anything wrong here, not upstream:
        https://github.com/bonninr/goplus/issues

        Hauptwerk `.Organ_Hauptwerk_xml` definitions load through the ordinary
        organ dialog. Options that cost processing time (wind model, per-pipe
        voicing) can be switched off for slower machines.

        Streaming is off by default because it wants fast storage. Turn it on in
        *Settings -> Options -> Cache* and set how much of the start of each
        sample stays in RAM there; the same options are on the command line:

            grandorgue --stream --head-kb 256 "your organ.organ"

        Use *Build the cache without loading the whole organ* the first time you
        load a set too large to fit in memory. On a Raspberry Pi, streaming
        needs a USB SSD or an NVMe hat - an SD card will not keep up.
        EOF
        rm -f NOTES.md.bak
        gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$TAG" goplus-* \
          --title "GoPlus preview - Hauptwerk support and streaming engine" \
          --notes-file NOTES.md \
          --prerelease
        echo "released:"
        gh release view "$TAG" --json url --jq .url
